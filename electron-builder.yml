appId: dev.linplayer.app
productName: LinPlayer
copyright: Copyright © LinPlayer Contributors
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
  - '!node_modules/**/*.map'
asarUnpack:
  - '**/*.node'
extraResources: []
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: AudioVideo
  icon: build/icons
  executableName: linplayer
  synopsis: Modern Linux media player
  description: A beautiful, fast, modern and privacy-friendly media player built specifically for Linux.
  desktop:
    entry:
      Name: LinPlayer
      Comment: Modern Linux Media Player
      Categories: AudioVideo;Player;Audio;Video;
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
appImage:
  synopsis: Modern Linux media player
npmRebuild: true
